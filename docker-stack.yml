version: '3.8'

services:
  api:
    image: rundelivery-api:latest
    deploy:
      replicas: 3
      restart_policy:
        condition: on-failure
      update_config:
        parallelism: 1
        delay: 10s
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DB_URI=mongodb://mongo:27017/rundelivery
    networks:
      - app_overlay

  mongo:
    image: mongo:6
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      restart_policy:
        condition: on-failure
    volumes:
      - mongo_data:/data/db
    networks:
      - app_overlay

networks:
  app_overlay:
    driver: overlay

volumes:
  mongo_data:
