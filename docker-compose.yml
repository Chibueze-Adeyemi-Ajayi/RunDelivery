version: '3.8'

services:
  api:
    build: .
    container_name: rundelivery_api
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=development
      - DB_URI=mongodb://mongo:27017/rundelivery
    depends_on:
      - mongo
    networks:
      - app_network
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules

  mongo:
    image: mongo:6
    container_name: rundelivery_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  mongo_data:
